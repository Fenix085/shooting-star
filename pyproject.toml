[project]
name = "shooting-star"
version = "0.1.0"
description = "CLI tool to search information about anime (description, genre, episodes, relations, etc.)"
readme = "README.md"
authors = [
    { name = "Fenix085", email = "vladimirhurtovyi@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pycryptodome>=3.24.0",
    "python-dotenv>=1.2.4",
    "requests>=2.32.0",
    "rich>=15.0.0",
]

[project.scripts]
shooting-star = "shooting_star:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
pythonPath = ["src"]
